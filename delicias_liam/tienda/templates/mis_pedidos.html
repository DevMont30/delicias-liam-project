<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Pedidos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
<h1>Mis Pedidos</h1>

<table class="table table-striped mt-4">
<tr>
<th>ID</th>
<th>Total</th>
<th>Fecha</th>
<th>Estado</th>
</tr>

{% for pedido in pedidos %}
<tr>
<td>#{{ pedido.id }}</td>
<td>$ {{ pedido.total }}</td>
<td>{{ pedido.fecha }}</td>
<td>{{ pedido.estado }}</td>
<td>
<a href="{% url 'factura' pedido.id %}" class="btn btn-primary btn-sm">
Descargar PDF
</a>
</td>
</tr>
{% empty %}
<tr>
<td colspan="4">No tienes pedidos aún.</td>
</tr>
{% endfor %}

</table>

<a href="/" class="btn btn-dark">
Volver tienda
</a>

</div>

</body>
</html>
