{% extends 'base.html' %}
{% block titulo %}Ingresar | Delicias Liam{% endblock %}
{% block contenido %}
<div class="container mt-5" style="max-width:26rem">
  <h1 class="mb-4">Ingresar</h1>
  <form method="post" class="panel-dl">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">El usuario o la contraseña no son correctos. Revisa los datos e inténtalo de nuevo.</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
      <input class="form-control" type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
      <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-dl w-100">Ingresar</button>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="{% url 'password_reset' %}">Olvidé mi contraseña</a>
      <a href="{% url 'registro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Crear cuenta</a>
    </div>
  </form>
</div>
{% endblock %}
