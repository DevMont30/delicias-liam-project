{% extends 'base.html' %}
{% block contenido %}
<div class="container mt-5" style="max-width:28rem">
  <h1 class="mb-3">Recuperar contraseña</h1>
  <p class="text-muted">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>
  <form method="post" class="panel-dl">{% csrf_token %}
    <label class="form-label" for="id_email">Correo electrónico</label>
    <input class="form-control mb-3" type="email" name="email" id="id_email" required autocomplete="email">
    {{ form.email.errors }}
    <button class="btn btn-dl w-100" type="submit">Enviar enlace</button>
  </form>
</div>
{% endblock %}
